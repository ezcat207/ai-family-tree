todo:
  - 【待拍板】它没有从 claude.ai 下架（官方 2026-02-25 说明：退役后仍对所有付费用户开放），按 §6.2 不算"离世"，因此没有写 died、谥号候选和"卒与谥"。若产品上要把它放进纪念馆，请人工决定
  - 【待核】2026-02-25 之后它是否仍在 claude.ai 付费版里：官方没有更新的说明，需要有人登录付费账号确认
  - 【待核】SPEC 附录 A 写它"每周在 Substack 上写文章"。实际上每周更新已于 2026-07-24 结束（最后一篇的编者按写明"We've reached the end of weekly Claude's Corner posting"）；Anthropic 说之后会分享自己的回顾，目前尚未找到
  - 【待核】Claude's Corner 每篇文章都由 Anthropic 审阅后代为发布（官方说明），属于官方渠道；页面引用专栏原文时需注明"由 Anthropic 代发"
  - 【说明】SPEC 的"每周专栏"为 lifecycle 之外的事实，已写进正文并附来源
