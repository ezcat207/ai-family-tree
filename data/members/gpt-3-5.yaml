    date: 2026-04-22
    source: https://developers.openai.com/api/docs/deprecations
    note: { zh: 宣布 API 中的 gpt-3.5-turbo 将于 2026-10-23 关停, en: "Announced that gpt-3.5-turbo in the API would shut down on 2026-10-23"}
