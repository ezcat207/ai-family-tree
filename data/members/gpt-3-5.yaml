    date: 2024-07-18
    source: https://openai.com/index/gpt-4o-mini-advancing-cost-efficient-intelligence/
    note: { zh: GPT-4o mini 接替它在 ChatGPT 里的位置, en: "GPT-4o mini took over their seat in ChatGPT"}
